experiment_name: baseline
seed: 42

data:
  path: data/processed/small_dataset.csv
  target_col: label
  val_split: 0.2
  test_split: 0.2

federation:
  num_clients: 3
  num_rounds: 5
  aggregator: ensemble        # (probability averaging)
  model: xgb                  # xgb|rf|lgbm|mlp

metrics:
  save_csv: output/federated_metrics.csv

calibration:
  enabled: false
  method: temperature
  bins: 15
  val_split: 0.2

logging:
  out_dir: output/
  save_models: true
